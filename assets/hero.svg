<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="TypstUniverseKit — native Swift for the Typst Universe">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#1a1a1a" opacity="0.10"/>
    </pattern>
  </defs>

  <!-- paper backdrop -->
  <rect x="0" y="0" width="1200" height="420" rx="28" fill="#f6f3ec"/>
  <rect x="0" y="0" width="1200" height="420" rx="28" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#e2dccf" stroke-width="2"/>
  <!-- margin rule -->
  <line x1="0" y1="372" x2="1200" y2="372" stroke="#e2dccf" stroke-width="2"/>

  <!-- gallery cards, right side (flat) -->
  <g>
    <g transform="rotate(-7 855 280)">
      <rect x="745" y="218" width="220" height="124" rx="10" fill="#f59e0b"/>
      <rect x="745" y="218" width="220" height="124" rx="10" fill="none" stroke="#1a1a1a" stroke-width="3"/>
      <rect x="761" y="234" width="110" height="12" rx="6" fill="#1a1a1a"/>
      <rect x="761" y="254" width="188" height="8" rx="4" fill="#1a1a1a" opacity="0.55"/>
      <rect x="761" y="270" width="150" height="8" rx="4" fill="#1a1a1a" opacity="0.55"/>
      <rect x="761" y="292" width="72" height="32" rx="7" fill="#f6f3ec" stroke="#1a1a1a" stroke-width="3"/>
    </g>

    <g transform="rotate(6 1128 292)">
      <rect x="1058" y="246" width="140" height="92" rx="10" fill="#239dad"/>
      <rect x="1058" y="246" width="140" height="92" rx="10" fill="none" stroke="#1a1a1a" stroke-width="3"/>
      <circle cx="1092" cy="278" r="13" fill="#f6f3ec" stroke="#1a1a1a" stroke-width="3"/>
      <rect x="1112" y="272" width="62" height="9" rx="4.5" fill="#1a1a1a"/>
      <rect x="1112" y="288" width="44" height="9" rx="4.5" fill="#1a1a1a" opacity="0.55"/>
    </g>

    <!-- main document -->
    <g transform="rotate(3 990 210)">
      <rect x="890" y="70" width="200" height="280" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
      <rect x="890" y="70" width="200" height="56" rx="10" fill="#1a1a1a"/>
      <rect x="890" y="102" width="200" height="24" fill="#1a1a1a"/>
      <rect x="906" y="88" width="104" height="12" rx="6" fill="#f6f3ec"/>
      <rect x="906" y="106" width="70" height="8" rx="4" fill="#f6f3ec" opacity="0.6"/>
      <rect x="906" y="140" width="168" height="62" rx="6" fill="#239dad" stroke="#1a1a1a" stroke-width="3"/>
      <circle cx="936" cy="164" r="11" fill="#f6f3ec"/>
      <rect x="956" y="158" width="92" height="9" rx="4.5" fill="#1a1a1a"/>
      <rect x="956" y="172" width="64" height="9" rx="4.5" fill="#1a1a1a" opacity="0.6"/>
      <rect x="906" y="216" width="168" height="9" rx="4.5" fill="#1a1a1a" opacity="0.75"/>
      <rect x="906" y="233" width="168" height="9" rx="4.5" fill="#1a1a1a" opacity="0.3"/>
      <rect x="906" y="250" width="120" height="9" rx="4.5" fill="#1a1a1a" opacity="0.3"/>
      <rect x="906" y="272" width="168" height="9" rx="4.5" fill="#1a1a1a" opacity="0.3"/>
      <rect x="906" y="289" width="88" height="9" rx="4.5" fill="#1a1a1a" opacity="0.3"/>
      <rect x="906" y="310" width="62" height="22" rx="11" fill="none" stroke="#1a1a1a" stroke-width="3"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="70" y="52" width="54" height="54" rx="12" fill="#1a1a1a"/>
    <text x="97" y="89" text-anchor="middle" font-size="30" font-weight="800" fill="#f6f3ec">Ty</text>

    <text x="70" y="184" font-size="64" font-weight="800" fill="#1a1a1a" letter-spacing="-1">TypstUniverseKit</text>
    <text x="72" y="230" font-size="27" font-weight="400" fill="#55534e">Native Swift for the Typst Universe.</text>

    <!-- feature pills -->
    <g font-size="20" font-weight="600" fill="#1a1a1a">
      <rect x="70" y="260" width="182" height="42" rx="21" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
      <text x="161" y="288" text-anchor="middle">Offline-first</text>
      <rect x="264" y="260" width="222" height="42" rx="21" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
      <text x="375" y="288" text-anchor="middle">Zero dependencies</text>
      <rect x="498" y="260" width="222" height="42" rx="21" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
      <text x="609" y="288" text-anchor="middle">Secure by default</text>
    </g>

    <text x="72" y="348" font-size="20" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#78716c">packages.typst.org  →  your app</text>
  </g>
</svg>
