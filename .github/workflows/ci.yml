name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"
jobs:
  build-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.4"
      - run: swift build -v
      - run: swift test -v
  docs:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.4"
      - run: swift package --allow-writing-to-directory ./docs generate-documentation --target TypstUniverseCore --output-path ./docs
